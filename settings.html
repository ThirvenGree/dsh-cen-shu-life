<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>岑舒生活</title>
<style>body{font:14px/1.65 system-ui,sans-serif;margin:0;padding:24px;color:#26362e;background:#f5f6f2}main{max-width:1000px;margin:auto}h1{font-size:24px}h2{font-size:17px;margin-top:28px}section{background:white;border:1px solid #d9dfd7;border-radius:12px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}label{display:block}input,select,textarea,button{font:inherit;padding:8px;border:1px solid #b8c6bc;border-radius:6px;box-sizing:border-box}input:not([type=checkbox]),select{width:100%}textarea{width:100%;min-height:160px}button{cursor:pointer;background:#e4efe6;margin:8px 8px 0 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7f4;padding:12px;border-radius:8px}small{color:#637368}#notice{position:sticky;top:0;background:#e4efe6;padding:10px;z-index:2}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #e2e8e0;padding:8px}</style>
<main><h1>岑舒生活</h1><p>生活事件随时间推进；心情只读，聊天由原有主动机制触发。</p><div id="notice" role="status">正在读取…</div>
<section><h2>运行设置</h2><form id="form"><div class="grid" id="fields"></div><h3>事件分类</h3><div id="categories" class="grid"></div><h3>行为模式阈值与持续时间</h3><small>强度按七维情绪数值；时间单位为分钟。仅影响生活插件，不修改原心情插件。</small><div id="thresholds" class="grid"></div><h3>行为模式规则（JSON 映射，可修改具体表达；空对象使用角色默认）</h3><textarea id="modeRules" aria-label="行为模式规则"></textarea><button type="submit">保存并立即生效</button></form></section>
<section><h2>当前状态</h2><div id="summary"></div><pre id="context"></pre><button id="refresh">刷新状态</button></section>
<section><h2>事件与进度</h2><div id="active"></div><select id="eventSelect"></select><button id="add">手动新增</button><button id="reset">结束全部进行中事件</button><small>手动操作同样遵循条件、冷却和数量上限；重置保留历史。</small><h3>最近结束</h3><div id="history"></div></section>
<section><h2>独立模拟测试</h2><p>测试数据不会写进真实心情或生活事件。</p><select id="scenario"></select><button id="simulate">运行模拟</button><pre id="simulation">选择情境后运行</pre></section></main>
<script>
const B='/dsh-cen-shu-life',el=id=>document.getElementById(id);let initial,dirty=false;
async function api(p,body){const r=await fetch(B+p,{cache:'no-store',...(body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{})});const x=await r.json();if(!r.ok||!x.ok)throw Error(x.error||'请求失败');return x;}
const fields=[['enabled','总开关','checkbox'],['sessionIds','目标会话 ID（多个以逗号分隔）','text'],['timezone','时区','text'],['checkMinutes','事件检查间隔（分钟）','number'],['maxDaily','每日新事件上限','number'],['maxActive','同时进行上限','number'],['probability','每次检查新事件概率（0–1）','number'],['context','动态上下文','checkbox'],['moodLinked','心情联动','checkbox'],['moodSlot','心情记录键','text'],['mentionCooldownMinutes','重复提及冷却（分钟）','number'],['travelEnabled','允许模拟出行','checkbox'],['payday','工资日（0 表示不设置）','number']];
const labels={work:'工作',personal:'个人生活',hobby:'兴趣',periodic:'周期',travel:'出行'},tlabels={confidence:'可信度门槛',happy:'开心',excited:'很高兴强度',sweet:'甜蜜',calm:'踏实',sad:'难过',worry:'担心',heartache:'心疼',jealous:'吃醋',delta:'显著变化幅度',moodHigh:'高于基线',moodLow:'低于基线',minHoldMinutes:'最短维持',releaseMinutes:'恢复过渡',maxHoldMinutes:'最长维持',evidenceMinutes:'心情证据有效期'};
function input(root,id,label,type,value){const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.id=id;i.type=type;if(type==='checkbox')i.checked=value;else{i.value=Array.isArray(value)?value.join(', '):value;if(type==='number')i.step='any';}i.oninput=()=>{dirty=true;el('notice').textContent='有修改未保存';};l.append(i);el(root).append(l);}
function build(c){el('modeRules').value=JSON.stringify(c.modeRules||{},null,2);el('modeRules').oninput=()=>{dirty=true;el('notice').textContent='有修改未保存';};for(const r of ['fields','categories','thresholds'])el(r).replaceChildren();for(const[k,l,t]of fields)input('fields',k,l,t,c[k]);for(const[k,v]of Object.entries(c.categories))input('categories','cat-'+k,labels[k]||k,'checkbox',v);for(const[k,v]of Object.entries(c.thresholds))input('thresholds','t-'+k,tlabels[k]||k,'number',v);}
function text(root,s){el(root).textContent=s;}
async function refresh(first=false){try{const x=await api('/state');initial=x.config;if(first)build(x.config);text('summary',`生活：${x.life.activity} · 心情读取：${x.mood.ok?'正常（只读 v2，'+x.mood.slot+'）':x.mood.error} · 当前行为：${x.state.mode?.id||'平常'} · ${x.state.mode?.reason||''}`);text('context',x.context||'未绑定会话或已关闭上下文');el('active').replaceChildren();for(const e of x.state.active){const d=document.createElement('div');d.textContent=e.name+' · '+e.stageText+' · '+new Date(e.endsAt).toLocaleString()+' 结束 ';const b=document.createElement('button');b.textContent='结束';b.onclick=()=>run(()=>api('/event',{action:'end',id:e.id}));d.append(b);el('active').append(d);}if(!x.state.active.length)text('active','暂无进行中的事件，今天也可以没有新事件');text('history',x.history.events.slice(-8).map(e=>e.name+'：'+e.endReason).join('；')||'暂无结束记录');if(first){el('eventSelect').replaceChildren();for(const e of x.templates){const o=document.createElement('option');o.value=e.id;o.textContent=e.name;el('eventSelect').append(o);}}if(!dirty)text('notice','已读取最新状态；设置保存后立即生效');}catch(e){text('notice',e.message);}}
async function run(f){try{await f();await refresh();text('notice','操作成功，已保存');}catch(e){text('notice',e.message);}}
el('form').onsubmit=e=>{e.preventDefault();const c={};for(const[k,,t]of fields)c[k]=t==='checkbox'?el(k).checked:t==='number'?+el(k).value:k==='sessionIds'?el(k).value.split(',').map(x=>x.trim()).filter(Boolean):el(k).value;c.categories=Object.fromEntries(Object.keys(initial.categories).map(k=>[k,el('cat-'+k).checked]));c.thresholds=Object.fromEntries(Object.keys(initial.thresholds).map(k=>[k,+el('t-'+k).value]));try{c.modeRules=JSON.parse(el('modeRules').value);}catch{return text('notice','行为模式规则 JSON 格式无效');}run(async()=>{await api('/config',c);dirty=false;});};
el('refresh').onclick=()=>refresh();el('add').onclick=()=>run(()=>api('/event',{action:'add',templateId:el('eventSelect').value}));el('reset').onclick=()=>run(()=>api('/event',{action:'reset'}));
const scenarios={normal:{},excited:{mood:90,dims:{happy:30}},pleased:{dims:{happy:12}},low:{mood:45,dims:{sad:24}},soft:{dialogue:{needsCare:true},dims:{worry:20}},embarrassed:{dialogue:{flirt:true},dims:{sweet:18}},jealous:{dialogue:{romance:true},dims:{jealous:20}},tired:{life:{fatigue:true}},annoyed:{life:{annoyed:true}},hurt:{dialogue:{offense:true}},panicked:{dialogue:{confession:true}}};
for(const k of Object.keys(scenarios)){const o=document.createElement('option');o.value=k;o.textContent=k;el('scenario').append(o);}
el('simulate').onclick=()=>run(async()=>{const s=scenarios[el('scenario').value],x=await api('/simulate',{...s,mood:{ok:true,mood:s.mood||70,baseline:70,confidence:90,updatedAt:Date.now(),dims:{happy:0,calm:0,sweet:0,heartache:0,worry:0,sad:0,jealous:0,...s.dims}},eventId:el('eventSelect').value});text('simulation',JSON.stringify(x,null,2));});
refresh(true);setInterval(()=>refresh(),15000);
</script></html>
